<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Shivalya Agrotech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body.login-body {
      background: #f0f4f1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 16px;
    }
    .login-card {
      background: #fff;
      border: 1px solid #d9e2db;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: #1b382b;
    }
    .login-header p {
      margin: 0;
      color: #64748b;
      font-size: 13px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1b382b;
    }
    .btn-login {
      width: 100%;
      background: #1b382b;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login:hover {
      background: #254d3b;
    }
    .btn-login:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .alert-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
    }
    .back-link:hover {
      color: #1b382b;
    }
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div style="font-size:28px;margin-bottom:8px">🌿</div>
      <h1>Shivalya Agrotech</h1>
      <p>Admin Portal Sign In</p>
    </div>

    <div id="alertBox" class="alert-box alert-error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@shivalya.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
    </form>

    <a href="/" class="back-link">← Back to Website</a>
  </div>

  <!-- Force Password Change Modal -->
  <div id="pwModal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin:0 0 8px 0;font-size:18px;color:#1b382b">Change Initial Password</h2>
      <p style="font-size:13px;color:#64748b;margin:0 0 16px 0">For security, you must update your password before proceeding.</p>
      <div id="pwModalAlert" class="alert-box alert-error"></div>
      <form id="pwForm" onsubmit="handleInitialPasswordChange(event)">
        <div class="form-group">
          <label for="newPw">New Password (min 6 characters)</label>
          <input type="password" id="newPw" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirmPw">Confirm New Password</label>
          <input type="password" id="confirmPw" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" id="changePwBtn" class="btn-login">Update Password & Continue</button>
      </form>
    </div>
  </div>

  <script>
    function getCsrfToken() {
      const match = document.cookie.match(/csrf_token=([^;]+)/);
      return match ? match[1] : '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('loginBtn');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/v1/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();

        if (!res.ok || !json.success) {
          throw new Error(json.error || 'Login failed.');
        }

        if (json.data && json.data.must_change_password) {
          // Open password change modal
          document.getElementById('pwModal').style.display = 'flex';
          window.loginCsrfToken = json.data.csrf_token || getCsrfToken();
          window.currentTempPassword = password;
        } else {
          window.location.href = '/admin/';
        }
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleInitialPasswordChange(e) {
      e.preventDefault();
      const newPw = document.getElementById('newPw').value;
      const confirmPw = document.getElementById('confirmPw').value;
      const alertBox = document.getElementById('pwModalAlert');
      const btn = document.getElementById('changePwBtn');

      alertBox.style.display = 'none';

      if (newPw !== confirmPw) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const csrfToken = window.loginCsrfToken || getCsrfToken();
        const res = await fetch('/api/v1/admin/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken,
          },
          body: JSON.stringify({
            current_password: window.currentTempPassword,
            new_password: newPw,
          }),
        });
        const json = await res.json();

        if (!res.ok || !json.success) {
          throw new Error(json.error || 'Failed to update password.');
        }

        window.location.href = '/admin/';
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Update Password & Continue';
      }
    }
  </script>
</body>
</html>
